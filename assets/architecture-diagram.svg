<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="architecture-title architecture-desc" focusable="false" xml:lang="en">
  <title id="architecture-title">Boost Skill three-phase multi-agent execution pipeline</title>
  <desc id="architecture-desc">A left-to-right pipeline: planning and worktree isolation, parallel specialist subagents, then physical build and test verification. The core invariant is that no AI code is reported as finished without real compiler and test-suite pass logs.</desc>
  <metadata id="asset-attribution">Creator: Ervareza Naurian. Inspiration: Google Antigravity /boost.</metadata>

  <defs>
    <style><![CDATA[
      :root { color-scheme: light dark; }

      .canvas { fill: #080a0f; }
      .panel { fill: #121622; }
      .panel-divider { stroke: #ffffff; stroke-opacity: 0.08; }
      .panel-title,
      .header-title { fill: #f8fafc; }
      .header-copy,
      .body-copy { fill: #b0b8c8; }
      .sub-copy { fill: #8a96a8; }
      .worker-surface { fill: #181e2e; }
      .worker-title { fill: #e2e8f0; }
      .invariant-bar { fill: #0e131d; stroke: #ffffff; stroke-opacity: 0.08; }
      .invariant-copy { fill: #cbd5e1; }
      .phase-1 { fill: #2a41ff; }
      .phase-1-text { fill: #67e8f9; }
      .phase-1-soft { fill: #eef2ff; }
      .phase-2 { fill: #7928ca; }
      .phase-2-text { fill: #f0abfc; }
      .phase-2-soft { fill: #fae8ff; }
      .phase-3 { fill: #00df89; }
      .phase-3-text { fill: #6ee7b7; }
      .phase-3-soft { fill: #d1fae5; }
      .arrow-1 { stroke: #0891b2; fill: #0891b2; }
      .arrow-2 { stroke: #a21caf; fill: #a21caf; }
      .shadow-color { flood-color: #000000; flood-opacity: 0.5; }

      @media (prefers-color-scheme: light) {
        .canvas { fill: #f8fafc; }
        .panel { fill: #ffffff; }
        .panel-divider { stroke: #0f172a; stroke-opacity: 0.12; }
        .header-title,
        .panel-title { fill: #0f172a; }
        .header-copy,
        .body-copy { fill: #475569; }
        .sub-copy { fill: #64748b; }
        .worker-surface { fill: #f1f5f9; }
        .worker-title { fill: #1e293b; }
        .invariant-bar { fill: #ffffff; stroke: #cbd5e1; stroke-opacity: 1; }
        .invariant-copy { fill: #334155; }
        .phase-1 { fill: #4f46e5; }
        .phase-1-text { fill: #0e7490; }
        .phase-1-soft { fill: #eef2ff; }
        .phase-2 { fill: #9333ea; }
        .phase-2-text { fill: #86198f; }
        .phase-2-soft { fill: #fae8ff; }
        .phase-3 { fill: #059669; }
        .phase-3-text { fill: #047857; }
        .phase-3-soft { fill: #d1fae5; }
        .arrow-1 { stroke: #0e7490; fill: #0e7490; }
        .arrow-2 { stroke: #86198f; fill: #86198f; }
        .shadow-color { flood-color: #64748b; flood-opacity: 0.18; }
      }
    ]]></style>

    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow class="shadow-color" dx="0" dy="8" stdDeviation="12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="canvas" width="1000" height="480" rx="16" />

  <!-- Header -->
  <g transform="translate(40, 40)">
    <text class="header-title" x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700">3-Phase Multi-Agent Execution Pipeline</text>
    <text class="header-copy" x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Architectural comparison: Linear Single-Agent vs /boost Verification Loop</text>
  </g>

  <!-- Phase 1: Planning -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect class="panel" width="280" height="260" rx="12" stroke="#2a41ff" stroke-opacity="0.55" stroke-width="1.5" />
    <rect class="phase-1" width="280" height="3" rx="2" aria-hidden="true" />
    <rect class="phase-1-soft" x="20" y="20" width="28" height="28" rx="6" />
    <text class="phase-1-text" x="34" y="39" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700">P1</text>
    <text class="panel-title" x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Planning &amp; Isolation</text>
    <path class="panel-divider" d="M 20 65 L 260 65" stroke-width="1" />
    <text class="body-copy" x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      <tspan x="20" dy="0">• AST Call-Graph Scan</tspan>
      <tspan x="20" dy="24">• Task Decomposition</tspan>
      <tspan x="20" dy="24">• Worktree Isolation:</tspan>
      <tspan x="30" dy="20" class="phase-1-text" font-family="monospace">git worktree add</tspan>
      <tspan x="30" dy="18" class="phase-1-text" font-family="monospace">.worktrees/boost-X</tspan>
      <tspan x="20" dy="24" class="phase-3-text">• Zero Working-Tree Dirty</tspan>
    </text>
  </g>

  <!-- Arrow 1 → 2 -->
  <path class="arrow-1" d="M 330 225 L 360 225" stroke-width="2" stroke-dasharray="4 4" />
  <polygon class="arrow-1" points="360,221 368,225 360,229" />

  <!-- Phase 2: Distributed Subagents -->
  <g transform="translate(370, 95)" filter="url(#shadow)">
    <rect class="panel" width="280" height="260" rx="12" stroke="#7928ca" stroke-opacity="0.55" stroke-width="1.5" />
    <rect class="phase-2" width="280" height="3" rx="2" aria-hidden="true" />
    <rect class="phase-2-soft" x="20" y="20" width="28" height="28" rx="6" />
    <text class="phase-2-text" x="34" y="39" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700">P2</text>
    <text class="panel-title" x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Parallel Subagents</text>
    <path class="panel-divider" d="M 20 65 L 260 65" stroke-width="1" />

    <rect class="worker-surface" x="20" y="80" width="240" height="42" rx="6" />
    <text class="worker-title" x="30" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Investigator Worker</text>
    <text class="sub-copy" x="30" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Read-only AST &amp; trace reproduction</text>

    <rect class="worker-surface" x="20" y="130" width="240" height="42" rx="6" />
    <text class="worker-title" x="30" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Implementation Worker</text>
    <text class="sub-copy" x="30" y="164" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Surgical code modifications</text>

    <rect class="worker-surface" x="20" y="180" width="240" height="42" rx="6" />
    <text class="worker-title" x="30" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">QA / TDD Test Crafter</text>
    <text class="sub-copy" x="30" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Creates failing assertions first</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <path class="arrow-2" d="M 660 225 L 690 225" stroke-width="2" stroke-dasharray="4 4" />
  <polygon class="arrow-2" points="690,221 698,225 690,229" />

  <!-- Phase 3: Physical Verification -->
  <g transform="translate(700, 95)" filter="url(#shadow)">
    <rect class="panel" width="260" height="260" rx="12" stroke="#00df89" stroke-opacity="0.55" stroke-width="1.5" />
    <rect class="phase-3" width="260" height="3" rx="2" aria-hidden="true" />
    <rect class="phase-3-soft" x="20" y="20" width="28" height="28" rx="6" />
    <text class="phase-3-text" x="34" y="39" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700">P3</text>
    <text class="panel-title" x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600">Physical Verification</text>
    <path class="panel-divider" d="M 20 65 L 240 65" stroke-width="1" />
    <text class="body-copy" x="20" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      <tspan x="20" dy="0">• Build &amp; Typecheck Exec</tspan>
      <tspan x="20" dy="24">• Test Suite (Exit Code 0)</tspan>
      <tspan x="20" dy="24">• Self-Healing Loop:</tspan>
      <tspan x="30" dy="20" fill="#b45309" font-family="monospace">Max 5 Iterations</tspan>
      <tspan x="20" dy="24">• Merge Verified Branch</tspan>
      <tspan x="20" dy="20" class="phase-3-text">• Prune Worktree &amp; Deliver</tspan>
    </text>
  </g>

  <!-- Bottom Bar: Invariant Banner -->
  <g transform="translate(40, 385)">
    <rect class="invariant-bar" width="920" height="55" rx="8" />
    <text class="invariant-copy" x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      <tspan class="phase-1-text" font-weight="600">Core Invariant:</tspan> No AI code is ever merged or reported as finished without real compiler and test suite pass logs.
    </text>
  </g>
</svg>
