<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="hero-title hero-desc" focusable="false" xml:lang="en">
  <title id="hero-title">Boost Skill — multi-agent reasoning and verification</title>
  <desc id="hero-desc">A three-phase overview of Boost Skill: isolated worktree planning, parallel specialist subagents, and physical build and test verification. Created by Ervareza Naurian and inspired by Google Antigravity /boost.</desc>
  <metadata id="asset-attribution">Creator: Ervareza Naurian. Inspiration: Google Antigravity /boost.</metadata>

  <defs>
    <style><![CDATA[
      :root { color-scheme: light dark; }

      .canvas { fill: #07090e; }
      .grid-lines { stroke: #ffffff; stroke-opacity: 0.035; }
      .frame { fill: #0b0e14; fill-opacity: 0.88; stroke: url(#card-border); }
      .card-surface { fill: #121620; fill-opacity: 0.92; stroke: url(#card-border); }
      .hero-title,
      .card-title,
      .inspiration-strong { fill: #f8fafc; }
      .subtitle,
      .card-copy { fill: #b0b8c8; }
      .inspiration,
      .footer-copy { fill: #8e9bb0; }
      .footer-strong { fill: #d4d8e3; }
      .badge { fill: url(#badge-glow); stroke: #00f0ff; stroke-opacity: 0.38; }
      .badge-label,
      .badge-dot { fill: #00f0ff; }
      .number-1 { fill: #5875ff; }
      .number-2 { fill: #00d2ff; }
      .number-3 { fill: #c084fc; }
      .number-bg-1 { fill: #2a41ff; fill-opacity: 0.2; }
      .number-bg-2 { fill: #00d2ff; fill-opacity: 0.2; }
      .number-bg-3 { fill: #7928ca; fill-opacity: 0.2; }
      .card-accent-1 { fill: #2a41ff; }
      .card-accent-2 { fill: #00d2ff; }
      .card-accent-3 { fill: #7928ca; }
      .accent-1 { fill: #8ea2ff; }
      .accent-2 { fill: #67e8f9; }
      .accent-3 { fill: #d8b4fe; }
      .ambient { opacity: 1; }
      .primary-stop-a { stop-color: #2a41ff; }
      .primary-stop-b { stop-color: #00d2ff; }
      .primary-stop-c { stop-color: #7928ca; }
      .border-stop-a { stop-color: #ffffff; stop-opacity: 0.15; }
      .border-stop-b { stop-color: #ffffff; stop-opacity: 0.02; }
      .badge-stop-a { stop-color: #00f0ff; stop-opacity: 0.2; }
      .badge-stop-b { stop-color: #2a41ff; stop-opacity: 0.05; }

      @media (prefers-color-scheme: light) {
        .canvas { fill: #f8fafc; }
        .grid-lines { stroke: #0f172a; stroke-opacity: 0.07; }
        .frame { fill: #ffffff; fill-opacity: 0.94; }
        .card-surface { fill: #ffffff; fill-opacity: 0.96; }
        .hero-title,
        .card-title,
        .inspiration-strong { fill: #0f172a; }
        .subtitle,
        .card-copy { fill: #475569; }
        .inspiration,
        .footer-copy { fill: #64748b; }
        .footer-strong { fill: #1e293b; }
        .badge { fill: #ecfeff; stroke: #0891b2; stroke-opacity: 0.55; }
        .badge-label,
        .badge-dot { fill: #0e7490; }
        .number-1 { fill: #1d4ed8; }
        .number-2 { fill: #0e7490; }
        .number-3 { fill: #7e22ce; }
        .number-bg-1 { fill: #eef2ff; fill-opacity: 1; }
        .number-bg-2 { fill: #cffafe; fill-opacity: 1; }
        .number-bg-3 { fill: #f3e8ff; fill-opacity: 1; }
        .card-accent-1 { fill: #4f46e5; }
        .card-accent-2 { fill: #0891b2; }
        .card-accent-3 { fill: #9333ea; }
        .accent-1 { fill: #3730a3; }
        .accent-2 { fill: #0e7490; }
        .accent-3 { fill: #7e22ce; }
        .ambient { opacity: 0.35; }
        .primary-stop-a { stop-color: #1d4ed8; }
        .primary-stop-b { stop-color: #0369a1; }
        .primary-stop-c { stop-color: #7e22ce; }
        .border-stop-a { stop-color: #cbd5e1; stop-opacity: 1; }
        .border-stop-b { stop-color: #e2e8f0; stop-opacity: 1; }
        .badge-stop-a { stop-color: #cffafe; stop-opacity: 1; }
        .badge-stop-b { stop-color: #dbeafe; stop-opacity: 1; }
      }
    ]]></style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop class="primary-stop-a" offset="0%" stop-color="#2a41ff" />
      <stop class="primary-stop-b" offset="50%" stop-color="#00d2ff" />
      <stop class="primary-stop-c" offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="border-stop-a" offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop class="border-stop-b" offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop class="badge-stop-a" offset="0%" stop-color="#00f0ff" stop-opacity="0.2" />
      <stop class="badge-stop-b" offset="100%" stop-color="#2a41ff" stop-opacity="0.05" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid-lines" d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect class="canvas" width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" aria-hidden="true" />

  <!-- Ambient Glow Orbs -->
  <circle class="ambient" cx="200" cy="150" r="180" fill="#2a41ff" fill-opacity="0.18" filter="url(#blur-glow)" aria-hidden="true" />
  <circle class="ambient" cx="1000" cy="480" r="220" fill="#00d2ff" fill-opacity="0.12" filter="url(#blur-glow)" aria-hidden="true" />
  <circle class="ambient" cx="600" cy="300" r="260" fill="#7928ca" fill-opacity="0.08" filter="url(#blur-glow)" aria-hidden="true" />

  <!-- Outer Framing Card -->
  <rect class="frame" x="40" y="40" width="1120" height="550" rx="24" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Top Navigation / Metadata Rail -->
  <g transform="translate(80, 85)">
    <rect class="badge" x="0" y="0" width="220" height="34" rx="17" stroke-width="1" />
    <circle class="badge-dot" cx="16" cy="17" r="4" />
    <text class="badge-label" x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">UNIVERSAL AI SKILL</text>

    <text class="inspiration" x="940" y="22" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Inspired by <tspan class="inspiration-strong" font-weight="700">Google Antigravity /boost</tspan>
    </text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(80, 165)">
    <text class="hero-title" x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5">
      BOOST <tspan fill="url(#primary-glow)">SKILL</tspan>
    </text>
    <text class="subtitle" x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.2">
      Multi-Agent Reasoning &amp; Independent Verification Pipeline for All AI Coding CLIs
    </text>
  </g>

  <!-- 3-Phase Architecture Feature Grid -->
  <g transform="translate(80, 310)">
    <!-- Card 1: Planning &amp; Isolation -->
    <g>
      <rect class="card-surface" width="326" height="180" rx="16" stroke="url(#card-border)" stroke-width="1" />
      <rect class="card-accent-1" width="326" height="3" rx="2" aria-hidden="true" />
      <rect class="number-bg-1" x="20" y="20" width="32" height="32" rx="8" />
      <text class="number-1" x="36" y="42" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700">01</text>
      <text class="card-title" x="64" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Worktree Isolation</text>
      <text class="card-copy" x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400">
        <tspan x="20" dy="0">Ephemeral Git worktrees shield</tspan>
        <tspan x="20" dy="20">active workspaces while planning</tspan>
        <tspan x="20" dy="20">AST call-graph decompositions.</tspan>
      </text>
    </g>

    <!-- Card 2: Distributed Execution -->
    <g transform="translate(356, 0)">
      <rect class="card-surface" width="326" height="180" rx="16" stroke="url(#card-border)" stroke-width="1" />
      <rect class="card-accent-2" width="326" height="3" rx="2" aria-hidden="true" />
      <rect class="number-bg-2" x="20" y="20" width="32" height="32" rx="8" />
      <text class="number-2" x="36" y="42" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700">02</text>
      <text class="card-title" x="64" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Distributed Subagents</text>
      <text class="card-copy" x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400">
        <tspan x="20" dy="0">Parallel specialist workers:</tspan>
        <tspan x="20" dy="20">Investigator, Code Implementer,</tspan>
        <tspan x="20" dy="20">and TDD Test Crafter.</tspan>
      </text>
    </g>

    <!-- Card 3: Multi-Round Verification -->
    <g transform="translate(712, 0)">
      <rect class="card-surface" width="328" height="180" rx="16" stroke="url(#card-border)" stroke-width="1" />
      <rect class="card-accent-3" width="328" height="3" rx="2" aria-hidden="true" />
      <rect class="number-bg-3" x="20" y="20" width="32" height="32" rx="8" />
      <text class="number-3" x="36" y="42" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700">03</text>
      <text class="card-title" x="64" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Physical Verification</text>
      <text class="card-copy" x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="400">
        <tspan x="20" dy="0">Iterative auto-healing loop.</tspan>
        <tspan x="20" dy="20">Delivers only when build &amp; test</tspan>
        <tspan x="20" dy="20">suites return <tspan class="accent-3" font-weight="600">100% PASS</tspan>.</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Footer Rail -->
  <g transform="translate(80, 545)">
    <text class="footer-copy" x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">
      Engineered by <tspan class="footer-strong" font-weight="600">Ervareza Naurian</tspan> • Universal Specification v1.0
    </text>
    <text class="footer-copy" x="1040" y="0" text-anchor="end" font-family="monospace" font-size="12">
      Hermes • Claude Code • Codex • OpenCode • Aider • Cursor
    </text>
  </g>
</svg>
